# 아웃랜더스 헌터 노트 — 사이트 배포 (GitHub Pages · GitHub Actions 방식, 띵조 ATM과 같은 구성)
# main에 올리면 Vite로 빌드한 dist/를 GitHub Pages에 배포합니다.
name: 사이트 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 데이터 점검
        run: python3 tools/validate.py src/data
      - name: 사이트 만들기
        run: |
          npm ci
          npm run build
          mv dist _site
          ls -la _site | head -30
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
