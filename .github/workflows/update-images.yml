# 공식 사이트 이미지 갱신: 매주 한 번(또는 직접 실행) 공식 사이트에서 모험가 · 동반자 · 몬스터 이미지를 받아
# public/img/에 커밋하고 사이트를 다시 배포합니다.
name: 공식 이미지 갱신

on:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * 0'   # 매주 월요일 04:17 (한국 시간)
  push:
    branches: [main]
    paths: ['tools/fetch_images.py', '.github/workflows/update-images.yml']

permissions:
  contents: write
  actions: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: 이미지 받기
        run: python3 tools/fetch_images.py
      - name: 바뀐 이미지 커밋
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/img
          if git diff --cached --quiet; then echo "changed=0" >> "$GITHUB_OUTPUT"; echo "변경 없음"; exit 0; fi
          git commit -m "공식 이미지 갱신"
          git push
          echo "changed=1" >> "$GITHUB_OUTPUT"
      - name: 사이트 다시 배포
        if: steps.commit.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
