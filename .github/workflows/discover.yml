# 데이터 조사용: 공식 사이트에서 이미지 · API 주소를 찾아 실행 로그에 출력합니다(저장소에는 남기지 않음).
name: 공식 사이트 조사

on:
  workflow_dispatch:
    inputs:
      list: { description: '주소 목록 파일', default: 'tools/discover-urls.txt' }
      kw: { description: '이 낱말 주변 출력(선택)', default: '' }
  push:
    branches: [main]
    paths: ['tools/discover.py', 'tools/discover-urls.txt']

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/discover.py "${{ inputs.list || 'tools/discover-urls.txt' }}" "${{ inputs.kw || 'character' }}"
