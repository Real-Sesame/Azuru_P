# 공식 데이터 자동 갱신: 매일(또는 Actions → 공식 데이터 자동 갱신 → Run workflow)
# 한국 · 동남아 공식 사이트에서 캐릭터 목록(이름 · 속성 · 직업)과 공식 이미지를 받아
# src/data/characters.json · public/img/를 갱신하고, 바뀌면 커밋 → 재배포 → 검토 이슈를 갱신합니다.
name: 공식 데이터 자동 갱신

on:
  workflow_dispatch:
  schedule:
    - cron: '41 21 * * *'   # 매일 06:41 (한국 시간)
    - cron: '41 9 * * *'    # 매일 18:41 (한국 시간) — 업데이트 · 픽업 당일 반영용
  push:
    branches: [main]
    paths: ['tools/sync_official.py', '.github/workflows/sync.yml']

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: 공식 사이트에서 받기
        run: python3 tools/sync_official.py
      - name: 데이터 점검
        run: python3 tools/validate.py src/data
      - name: 바뀐 내용 커밋
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data public/img
          if git diff --cached --quiet; then echo "changed=0" >> "$GITHUB_OUTPUT"; echo "변경 없음"; exit 0; fi
          { echo "공식 데이터 자동 갱신"; echo; cat tools/.sync-report.md; } > /tmp/msg.txt
          git commit -F /tmp/msg.txt
          git push
          echo "changed=1" >> "$GITHUB_OUTPUT"
      - name: 사이트 다시 배포
        if: steps.commit.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
      - name: 검토 이슈 갱신
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="[자동] 데이터 검토 필요"
          NUM=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if grep -qE "^### (새 캐릭터|공식 정보로 고친|경고|자동 추가 후)" tools/.sync-report.md; then
            { echo "공식 데이터 자동 갱신 결과입니다 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')). 확인 후 데이터를 채우면 됩니다."; echo; cat tools/.sync-report.md; } > /tmp/body.md
            if [ -n "$NUM" ]; then gh issue edit "$NUM" --body-file /tmp/body.md; else gh issue create --title "$TITLE" --body-file /tmp/body.md; fi
          elif [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "검토할 항목이 없어 닫습니다."
          fi
